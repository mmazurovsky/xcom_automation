version: '3.8'

services:
  xcom-automation:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.digitalocean.com/mmazurovsky-registry/xcom-automation
    container_name: xcom-automation
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
